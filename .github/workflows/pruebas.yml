name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  codigo:
    name: Código (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, zip, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Sintaxis de todos los archivos PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l -d display_errors=1 > /tmp/lint.txt || { grep -v '^No syntax errors' /tmp/lint.txt; exit 1; }
          echo "$(wc -l < /tmp/lint.txt) archivos sin errores"

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress

      - name: Pruebas unitarias
        run: vendor/bin/phpunit --testsuite unitarias

      - name: Análisis estático
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Librerías sin fallas de seguridad conocidas
        run: composer audit --no-dev

  sistema:
    name: API, panel y base de datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configuración de prueba
        run: |
          cat > backend/.env <<'EOF'
          MYSQL_HOST=mysql
          MYSQL_PORT=3306
          MYSQL_DATABASE=piccolodb
          MYSQL_USER=piccolo
          MYSQL_PASSWORD=piccolo_ci
          MYSQL_ROOT_PASSWORD=root_ci
          SESSION_SAMESITE=Lax
          EOF

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, zip, pdo_mysql
          coverage: none

      # Antes de Docker: el contenedor monta backend/ y si no, vendor/ queda a nombre de root
      - name: Instalar dependencias para las pruebas
        working-directory: backend
        run: composer install --no-interaction --no-progress

      - name: Levantar el sistema con Docker
        run: docker compose up -d --build frontend backend mysql

      - name: Esperar a que la API responda
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/api/v1/menu > /dev/null; then echo "Lista"; exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Recorrido de la API
        run: php backend/tests/ApiTest.php http://localhost:8080/api/v1

      - name: Permisos del panel por rol
        env:
          PANEL_USUARIOS: 'admin:Usuario:Usuario1!,empleado:Empleado:Empleado1!,delivery:Delivery:Delivery1!'
        run: php backend/tests/PanelPermisosTest.php http://localhost:8080/admin

      - name: Base de pruebas
        run: |
          docker compose exec -T mysql mysql -uroot -proot_ci \
            -e "CREATE DATABASE piccolodb_pruebas; GRANT ALL ON piccolodb_pruebas.* TO 'piccolo'@'%';"
          docker compose exec -T -e MYSQL_DATABASE=piccolodb_pruebas backend php /var/www/html/bin/migrar.php --con-datos

      - name: Pruebas con base de datos (pedidos, reservas y límite de intentos)
        working-directory: backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_DATABASE: piccolodb_pruebas
        run: vendor/bin/phpunit --testsuite integracion --fail-on-skipped

      - name: Registros del backend si algo falla
        if: failure()
        run: docker compose logs backend
