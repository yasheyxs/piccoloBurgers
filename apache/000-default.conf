<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Alias para /admin
    Alias /admin /var/www/html/admin
    <Directory /var/www/html/admin>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/html/(app|config|database|frontend|includes|shared|vendor)(/|$)">
        Require all denied
    </DirectoryMatch>
</VirtualHost>
