<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Piccolo Burgers</title>
  <meta name="description" content="Ingresá a tu cuenta de Piccolo Burgers para pedir más rápido y sumar puntos.">
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>

<body data-raiz="../">

  <main class="auth">
    <div class="auth-imagen" aria-hidden="true"></div>

    <div class="auth-panel">
      <form id="form-login" class="auth-form" novalidate>
        <h1>Iniciar sesión</h1>

        <div data-mensaje aria-live="polite" hidden></div>

        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono:</label>
          <div class="input-group">
            <select id="codigo-pais" name="codigoPais" class="form-select selector-pais" aria-label="Código de país" required></select>
            <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="Ej: 3511234567"
              inputmode="numeric" autocomplete="tel-national" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña:</label>
          <div class="input-group">
            <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
            <button type="button" class="btn btn-ver-password" data-ver-password="password" aria-label="Mostrar contraseña" aria-pressed="false">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-gold mt-3">Iniciar sesión</button>

        <div class="auth-enlaces">
          <p>¿No tenés cuenta? <a href="registro.html" id="enlace-registro">Registrate acá</a></p>
          <p><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>
          <a href="../index.html" class="btn btn-volver">← Volver al inicio</a>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../assets/js/pages/login.js"></script>
</body>

</html>
