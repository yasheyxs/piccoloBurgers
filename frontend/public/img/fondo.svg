<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2c2c"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.75" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#fac30c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fac30c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="puntos" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.6" fill="#fac30c" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#base)"/>
