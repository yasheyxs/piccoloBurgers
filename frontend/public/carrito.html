<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito - Piccolo Burgers</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/custom.css">
  <link rel="stylesheet" href="assets/css/carrito.css">
  <link rel="stylesheet" href="assets/css/componentes.css">
</head>

<body>

  <main>
    <div class="container contenido-ajustado">
      <div class="container carrito-panel">
        <h2 class="mb-4 text-center"><i class="fa-solid fa-cart-shopping me-2" aria-hidden="true"></i>Tu Carrito</h2>

        <div id="carrito-contenido" class="row row-cols-2 row-cols-md-4 g-4" aria-live="polite">
          <p class="estado-vacio w-100 col-12">
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Cargando tu carrito...
          </p>
        </div>

        <div class="d-flex justify-content-center mt-4">
          <a href="index.html#menu" class="btn btn-gold-circle" title="Agregar más" aria-label="Agregar más productos">
            <i class="fas fa-plus" aria-hidden="true"></i>
          </a>
        </div>

        <div class="text-end mt-4">
          <h4>Total: <span id="total">$ 0</span></h4>
          <div id="descuento-puntos"></div>

          <!-- Solo para clientes con sesión iniciada: lo completa carrito.js -->
          <div id="usar-puntos" class="usar-puntos-wrapper mt-3" hidden>
            <div class="form-check d-flex justify-content-end align-items-center gap-2 m-0">
              <input class="form-check-input mt-0" type="checkbox" id="usarPuntos">
              <label class="form-check-label mb-0" for="usarPuntos" id="usar-puntos-etiqueta">Usar puntos</label>
            </div>
            <p class="usar-puntos-helper mb-0 text-end" id="usar-puntos-ayuda"></p>
          </div>

          <div class="d-flex justify-content-end gap-3 mt-4 flex-wrap">
            <a href="confirmar-pedido.html" class="btn btn-gold disabled" id="btnContinuar" aria-disabled="true">
              <i class="fa-solid fa-receipt me-2" aria-hidden="true"></i>Continuar
            </a>
            <button type="button" class="btn btn-outline-danger-rounded" id="btnCancelar" disabled>Cancelar Pedido</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-light text-center py-3 mt-5">
    <p class="mb-0">&copy; 2025 Piccolo Burgers — Developed by: <strong>Jazmin Abigail Gaido - Mariano Jesús Ceballos - Juan Pablo Medina</strong></p>
  </footer>

  <div class="modal fade" id="modalCancelarPedido" tabindex="-1" aria-labelledby="modalCancelarPedidoLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title" id="modalCancelarPedidoLabel">¿Cancelar pedido?</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-3">Estás por cancelar tu pedido. Este es el detalle actual:</p>
          <div id="detallePedidoModal" class="mb-3"></div>
          <div class="text-end">
            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Conservar</button>
            <button type="button" class="btn btn-danger" id="btnConfirmarCancelacion">Cancelar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="assets/js/pages/carrito.js"></script>
</body>

</html>
