<VirtualHost *:80>
    # Solo backend/public es accesible desde el navegador.
    # El panel de administracion vive en public/admin y se sirve en /admin/.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/html/(src|views|config|database|tests|vendor|apache)(/|$)">
        Require all denied
    </DirectoryMatch>
</VirtualHost>
